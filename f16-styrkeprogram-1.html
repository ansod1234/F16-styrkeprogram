<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>F16 Styrkeprogram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F141B;
    --surface:#161E29;
    --surface-2:#1D2635;
    --line:#2A3546;
    --text:#EAEDF2;
    --text-dim:#8D98A8;
    --l1:#4FA7D9;
    --l2:#E8A33D;
    --l3:#E1544F;
    --accent-soft:rgba(232,163,61,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;letter-spacing:0.01em;}
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}

  header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding-top:14px;
  }
  .titlebar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .titlebar h1{font-size:20px;font-weight:700;margin:0;color:var(--text);}
  .titlebar .sub{font-size:11px;color:var(--text-dim);font-weight:500;}
  nav.tabs{display:flex;gap:0;margin-bottom:0;}
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;
    padding:10px 0;cursor:pointer;border-bottom:2px solid transparent;
  }
  nav.tabs button.active{color:var(--text);border-bottom:2px solid #fff;}

  .levelbar{display:flex;gap:6px;padding:10px 0;}
  .levelbtn{
    flex:1;text-align:center;padding:9px 4px;border-radius:3px;
    border:1px solid var(--line);background:var(--surface);
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;
    color:var(--text-dim);cursor:pointer;
  }
  .levelbtn small{display:block;font-family:'Inter';font-weight:400;font-size:9px;margin-top:2px;letter-spacing:0.02em;}
  .levelbtn[data-l="1"].active{background:var(--l1);border-color:var(--l1);color:#06111a;}
  .levelbtn[data-l="2"].active{background:var(--l2);border-color:var(--l2);color:#1a0f00;}
  .levelbtn[data-l="3"].active{background:var(--l3);border-color:var(--l3);color:#1a0403;}

  .passbar{display:flex;gap:6px;padding-bottom:10px;}
  .passbtn{
    flex:1;text-align:center;padding:7px 4px;border-radius:3px;
    border:1px solid var(--line);background:transparent;
    font-family:'Inter';font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;
  }
  .passbtn.active{border-color:#fff;color:var(--text);}

  .rulesnote{font-size:11px;color:var(--text-dim);padding:8px 0 4px;line-height:1.5;}
  .rulesnote b{color:var(--text);}

  .passtitle{padding:14px 0 4px;}
  .passtitle h2{font-size:16px;margin:0 0 3px;color:var(--text);}
  .passtitle p{font-size:12px;color:var(--text-dim);margin:0;line-height:1.4;}

  .block{margin:16px 0;border-left:2px solid var(--line);padding-left:12px;position:relative;}
  .block.superset{border-left-color:#3A465B;}
  .blockhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .blockhead h3{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin:0;font-weight:600;font-family:'Inter';}
  .ssbadge{font-size:9px;color:#3A465B;border:1px solid #3A465B;padding:1px 6px;border-radius:20px;font-family:'Inter';letter-spacing:0.03em;}
  .blocknote{font-size:11px;color:var(--text-dim);margin:-4px 0 8px;font-style:italic;}

  .exercise{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2px;
    padding:12px;
    margin-bottom:10px;
  }
  .exercise .exname{font-size:14px;font-weight:600;margin-bottom:2px;}
  .exercise .excomment{font-size:11px;color:var(--text-dim);margin-bottom:9px;line-height:1.4;}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .opt{
    font-size:12px;padding:6px 10px;border-radius:20px;
    border:1px solid var(--line);background:var(--surface-2);
    color:var(--text-dim);cursor:pointer;line-height:1.3;
  }
  .opt.only{cursor:default;}
  .opt.chosen{border-color:currentColor;color:var(--text);background:var(--accent-soft);}
  .scheme{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;margin-bottom:10px;}

  .nolognote{
    font-size:11px;color:var(--text-dim);padding:8px 0 0;border-top:1px solid var(--line);margin-top:2px;
  }

  .setrows{margin-bottom:8px;}
  .setrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .setrow .setlabel{width:38px;font-size:11px;color:var(--text-dim);flex-shrink:0;}
  .setrow input{
    width:64px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);font-size:14px;padding:7px 8px;border-radius:3px;
    font-family:'Inter';text-align:center;
  }
  .setrow input::placeholder{color:#4A5568;}
  .savebtnrow{display:flex;justify-content:flex-end;}
  .save-btn{
    background:#fff;color:#0F141B;border:none;
    font-family:'Oswald';font-weight:600;font-size:12px;
    padding:8px 16px;border-radius:3px;cursor:pointer;
  }
  .save-btn:active{opacity:0.7;}
  .lastlog{font-size:11px;color:var(--text-dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.5;}
  .lastlog b{color:var(--text);font-weight:600;}
  .savedflash{color:#7FD99A !important;}

  .rulesbox{
    margin:20px 0 8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:2px;
  }
  .rulesbox summary{font-family:'Oswald';font-size:13px;font-weight:600;cursor:pointer;color:var(--text);}
  .rulesbox ul{margin:10px 0 0;padding-left:18px;font-size:12px;color:var(--text-dim);line-height:1.6;}
  .rulesbox li{margin-bottom:6px;}

  .histday{margin:18px 0;}
  .histday h3{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:0 0 8px;font-weight:600;}
  .histentry{

  }
  .histentry .hn{font-weight:500;}
  .histentry .hn small{display:block;color:var(--text-dim);font-size:11px;margin-top:2px;}
  .histentry .hv{font-family:'Oswald';font-weight:600;font-size:13px;margin-top:4px;}
  .emptystate{padding:40px 10px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.6;}

  .histactions{display:flex;gap:8px;margin:14px 0 4px;}
  .histactions button, .histactions label{
    flex:1;text-align:center;font-size:12px;font-weight:600;font-family:'Inter';
    border:1px solid var(--line);background:var(--surface);color:var(--text-dim);
    padding:9px 0;border-radius:3px;cursor:pointer;
  }
  .histactions input[type=file]{display:none;}
</style>
</head>

const RIR_NOTE = {1:'Aldrig under 3–4 RIR.', 2:'Aldrig under 2–3 RIR.', 3:'Huvudlyft kan byggas mot 1–2 RIR.'};

// ---------- Scheme parsing ----------
// "3–4×6–8, bygg mot 2–3 RIR" -> {sets:4, unit:'reps'}
// "2×10–15 sek/sida" -> {sets:2, unit:'sek'}
function parseScheme(scheme){
  const m = scheme.match(/^(\d+)(?:[–-](\d+))?\s*×/);
  let sets = 1;
  if(m){ sets = m[2] ? Math.max(parseInt(m[1]), parseInt(m[2])) : parseInt(m[1]); }
  const unit = scheme.includes('sek') ? 'sek' : 'reps';
  return {sets, unit};
}

// ---------- State & storage ----------
const STATE_KEY = 'f16_state_v1';
const LOG_KEY = 'f16_log_v2';

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STATE_KEY));
    if(s && s.level && s.pass) return s;
  }catch(e){}
  return {level:1, pass:'A', chosen:{}};
}
function saveState(){ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

function loadLog(){
  try{
    const l = JSON.parse(localStorage.getItem(LOG_KEY));
    if(Array.isArray(l)) return l;
  }catch(e){}
  return [];
}
function saveLog(){ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }

let state = loadState();
let log = loadLog();

function exKey(passId, ex){ return passId + ':' + ex.id; }

function findExercise(passId, exId){
  for(const b of PROGRAM[passId].blocks){
    for(const ex of b.exercises){ if(ex.id===exId) return ex; }
  }
  return null;
}

function lastSessionFor(k){
  let bestTs = 0, rows = [];
  log.forEach(e=>{
    if(e.exerciseKey===k){
      if(e.sessionTs > bestTs){ bestTs = e.sessionTs; rows = [e]; }
      else if(e.sessionTs === bestTs){ rows.push(e); }
    }
  });
  rows.sort((a,b)=>a.setIndex-b.setIndex);
  return rows.length ? rows : null;
}

  el.innerHTML = `
    <div class="levelbar">
      ${[1,2,3].map(l=>`<button class="levelbtn ${state.level==l?'active':''}" data-l="${l}">NIVÅ ${l}<small>${l==1?'Teknik':l==2?'Bygg':'Damlag-nivå'}</small></button>`).join('')}
    </div>
    <div class="passbar">
      <button class="passbtn ${state.pass=='A'?'active':''}" data-p="A">PASS A</button>
      <button class="passbtn ${state.pass=='B'?'active':''}" data-p="B">PASS B</button>
    </div>
    <div class="rulesnote">Nivåplacering bestäms av fystränaren. <b>${RIR_NOTE[state.level]}</b> Gå aldrig till failure.</div>
  `;
  el.querySelectorAll('.levelbtn').forEach(b=>b.onclick=()=>{ state.level=parseInt(b.dataset.l); saveState(); renderAll(); });
  el.querySelectorAll('.passbtn').forEach(b=>b.onclick=()=>{ state.pass=b.dataset.p; saveState(); renderAll(); });
}

function renderExercise(passId, ex){
  const k = exKey(passId, ex);
  const lvl = ex.levels[state.level];
  const chosenIdx = state.chosen[k] || 0;
  const optHtml = lvl.opts.length>1
    ? lvl.opts.map((o,i)=>`<button class="opt ${i===chosenIdx?'chosen':''}" data-i="${i}" style="color:${i===chosenIdx?levelColor(state.level):''}">${o}</button>`).join('')
    : `<span class="opt only">${lvl.opts[0]}</span>`;

  let bodyHtml;
  if(ex.noLog){
    bodyHtml = `<div class="nolognote">Teknik/kraftövning — ingen vikt eller reps att logga här.</div>`;
  }else{
    const {sets, unit} = parseScheme(lvl.scheme);
    const last = lastSessionFor(k);
    const rowsHtml = Array.from({length:sets}).map((_,i)=>`
      <div class="setrow" data-set="${i+1}">
        <span class="setlabel">Set ${i+1}</span>
        <input type="number" inputmode="decimal" class="w-input" placeholder="kg" />
        <input type="number" inputmode="numeric" class="r-input" placeholder="${unit}" />
      </div>
    `).join('');
    const lastHtml = last ? `<div class="lastlog">Senast (${last[0].dateStr}, Nivå ${last[0].level}): ${last.map(r=>`${r.weight?r.weight+'kg':''}${r.weight&&r.reps?'×':''}${r.reps?r.reps+(r.unit==='sek'?'s':''):''}`).filter(Boolean).join(', ')}</div>` : '';
    bodyHtml = `
      <div class="setrows">${rowsHtml}</div>
      <div class="savebtnrow"><button class="save-btn">Spara</button></div>
      ${lastHtml}
    `;
  }

  return `
    <div class="exercise" data-key="${k}">
      <div class="exname">${ex.name}</div>
      <div class="excomment">${ex.comment}</div>
      <div class="opts">${optHtml}</div>
      <div class="scheme" style="color:${levelColor(state.level)}">${lvl.scheme}</div>
      ${bodyHtml}
    </div>
  `;
}

function renderProgram(){
  const p = PROGRAM[state.pass];
  const el = document.getElementById('programView');
  el.innerHTML = `
    <div class="passtitle"><h2>${p.title}</h2><p>${p.subtitle}</p></div>
    ${p.blocks.map(b=>`
      <div class="block ${b.superset?'superset':''}">
        <div class="blockhead"><h3>${b.title}</h3>${b.superset?'<span class="ssbadge">Superset · N2–3</span>':''}</div>
        ${b.note?`<div class="blocknote">${b.note}</div>`:''}
        ${b.exercises.map(ex=>renderExercise(state.pass, ex)).join('')}
      </div>
    `).join('')}
    <details class="rulesbox">
      <summary>Grundregler</summary>
      <ul>
        <li>Teknik går alltid före belastning — oavsett nivå.</li>
        <li>Nivå 1 tränar kroppsvikt/lätt belastning tills tekniken sitter — det är en teknikfråga, inte en tidsfråga.</li>
        <li>Gå aldrig till failure. N1 min 3–4 RIR, N2 min 2–3 RIR, N3 max mot 1–2 RIR på huvudlyftet.</li>
        <li>Prehab är obligatoriskt i varje pass, oavsett nivå eller träningsfrekvens.</li>
        <li>Vid tvekan om nivå: välj nivån under snarare än att pressa på för tidigt.</li>
      </ul>
    </details>
  `;

  el.querySelectorAll('.exercise').forEach(card=>{
    const k = card.dataset.key;
    card.querySelectorAll('.opt[data-i]').forEach(btn=>{
      btn.onclick = ()=>{
        state.chosen[k] = parseInt(btn.dataset.i);
        saveState();
        renderProgram();
      };
    });
    const saveBtn = card.querySelector('.save-btn');
    if(!saveBtn) return;
    saveBtn.onclick = ()=>{
      const exId = k.split(':')[1];
      const ex = findExercise(state.pass, exId);
      const lvl = ex.levels[state.level];
      const {unit} = parseScheme(lvl.scheme);
      const idx = state.chosen[k] || 0;
      const sessionTs = Date.now();
      const now = new Date();
      const dateStr = now.toLocaleDateString('sv-SE');
      let savedAny = false;
      card.querySelectorAll('.setrow').forEach(row=>{
        const w = row.querySelector('.w-input').value.trim();
        const r = row.querySelector('.r-input').value.trim();
        if(!w && !r) return;
        savedAny = true;
        log.push({
          id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
          sessionTs, dateStr,
          pass: state.pass, level: state.level,
          exerciseKey: k, exerciseName: ex.name,
          option: lvl.opts[idx], scheme: lvl.scheme,
          setIndex: parseInt(row.dataset.set),
          weight: w, reps: r, unit
        });
      });
      if(!savedAny) return;
      saveLog();
      saveBtn.textContent = 'Sparat';
      saveBtn.classList.add('savedflash');
      setTimeout(()=>{ renderProgram(); }, 550);
    };
  });
}

function renderLogg(){
  const el = document.getElementById('loggView');
  if(log.length===0){
    el.innerHTML = `<div class="emptystate">Inget loggat än.<br>Spara vikt och reps under en övning i Program-fliken för att se historik här.</div>`;
    return;
  }
  // group by dateStr -> sessionTs+exerciseKey -> sets[]
  const byDate = {};
  log.forEach(e=>{
    byDate[e.dateStr] = byDate[e.dateStr] || {};
    const gk = e.sessionTs + '_' + e.exerciseKey;
    byDate[e.dateStr][gk] = byDate[e.dateStr][gk] || {exerciseName:e.exerciseName, pass:e.pass, level:e.level, option:e.option, ts:e.sessionTs, sets:[]};
    byDate[e.dateStr][gk].sets.push(e);
  });
  const dateKeys = Object.keys(byDate).sort((a,b)=>{
    const da = new Date(a.split('.').reverse().join('-'));
    const db = new Date(b.split('.').reverse().join('-'));
    return db-da;
  });
  el.innerHTML = `
    <div class="histactions">
      <button id="exportBtn">Exportera logg</button>
      <label>Importera<input type="file" id="importFile" accept="application/json"></label>
    </div>
    ${dateKeys.map(d=>{
      const groups = Object.values(byDate[d]).sort((a,b)=>b.ts-a.ts);
      return `
      <div class="histday">
        <h3>${d}</h3>
        ${groups.map(g=>{
          g.sets.sort((a,b)=>a.setIndex-b.setIndex);
          const setsStr = g.sets.map(s=>`${s.weight?s.weight+'kg':''}${s.weight&&s.reps?'×':''}${s.reps?s.reps+(s.unit==='sek'?'s':''):''}`).filter(Boolean).join(', ');
          return `
            <div class="histentry">
              <div class="hn">${g.exerciseName}<small>Pass ${g.pass} · Nivå ${g.level} · ${g.option}</small></div>
              <div class="hv" style="color:${levelColor(g.level)}">${setsStr}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;}).join('')}
  `;
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(log, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'f16-styrkelogg-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
  };
  document.getElementById('importFile').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(Array.isArray(imported)){
          const existingIds = new Set(log.map(l=>l.id));
          imported.forEach(item=>{ if(item.id && !existingIds.has(item.id)) log.push(item); });
          log.sort((a,b)=>a.sessionTs-b.sessionTs);
          saveLog();
          renderLogg();
        }
      }catch(err){ alert('Kunde inte läsa filen.'); }
    };
    reader.readAsText(file);
  };
}

function renderAll(){
  renderTopBar();
  renderProgram();
  renderLogg();
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const tab = b.dataset.tab;
    document.getElementById('programView').style.display = tab==='program'?'block':'none';
    document.getElementById('loggView').style.display = tab==='logg'?'block':'none';
    if(tab==='logg') renderLogg();
  };
});

renderAll();
</script>
</body>
</html>
